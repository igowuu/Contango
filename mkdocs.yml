site_name: Contango
site_url: https://igowuu.github.io/Contango/ 
repo_url: https://github.com/igowuu/Contango

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

nav:
