site_name: Contango
theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Broker:
      - broker/index.md
  - Data:
      - data/index.md
  - Trading:
      - Indicators: trading/indicators/index.md
      - Execution: trading/execution/index.md
      - Optimizer: trading/optimizer/index.md
      - Analyzer: trading/analyzer/index.md
  - API Reference:
      - Broker:
          - Calendar:
              - Calendar: reference/broker/calendar/calendar.md
              - NYSE Calendar: reference/broker/calendar/nyse_calendar.md
          - Historical Brokers:
              - Config Type: reference/broker/historical_brokers/config_type.md
              - Historical Broker: reference/broker/historical_brokers/historical_broker.md
              - yfinance:
                  - yfinance: reference/broker/historical_brokers/yfinance/yfinance.md
                  - yfinance Config: reference/broker/historical_brokers/yfinance/yfinance_config.md
      - Data:
          - Data Repository: reference/data/data_repository.md
          - Storage:
              - Store Market Data: reference/data/storage/store_market_data.md
      - Research:
          - Research Runner: reference/research/research_runner.md
          - Research Strategies:
              - Bollinger Band Mean Reversion:
                  - Runner: reference/research/research_strategies/bollinger_band_mean_reversion/runner.md
                  - Strategy: reference/research/research_strategies/bollinger_band_mean_reversion/strategy.md
      - Trading:
