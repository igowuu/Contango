  - Getting Started:
      - Installation: getting-started/installation.md
  - Runners:
      - Grid Search Runner: runners/grid_search_runner.md
      - Static Runner: runners/static_runner.md
  - Stream:
      - Streams: stream/streams.md
      - Indicators: stream/indicators/indicators.md
  - Trading:
      - Backtest: trading/execution/backtester.md
      - Engine: trading/execution/engine.md
      - Metrics: trading/metrics/generation.md
      - Graphing: trading/analysis/graphing.md
  - Market:
      - Calendar: market/calendar.md
      - Historical Data: market/historical-data-provider.md
  - Data:
      - Data Repository: data/repository.md
  - Strategy:
